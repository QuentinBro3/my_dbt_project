version: 2

models:
  - name: stg_localbike__brands
    description: "This model contains information about the brands of products available at Local Bike."
    columns:
      - name: brand_id
        description: "Primary key, unique identifier for each brand."
        data_tests:
          - unique
          - not_null
      - name: brand_name
        description: "Name of the brand."

  - name: stg_localbike__categories
    description: "This model contains information about product categories."
    columns:
      - name: category_id
        description: "Primary key, unique identifier for each product category."
        data_tests:
          - unique
          - not_null
      - name: category_name
        description: "Name of the product category (e.g. mountain bikes, road bikes)."

  - name: stg_localbike__customers
    description: "This model contains customer-related information, including their contact details and address."
    columns:
      - name: customer_id
        description: "Primary key, unique identifier for each customer."
        data_tests:
          - unique
          - not_null
      - name: email
        description: "Customer email address, lowercased."
      - name: zip_code
        description: "Customer zip code, stored as a string to keep leading zeros."

  - name: stg_localbike__order_items
    description: "This model contains information about each item included in an order, including quantity, list price, and discount."
    columns:
      - name: order_item_id
        description: "Primary key, unique identifier for each order item, generated by concatenating order_id and item_id."
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key linking the order item to the corresponding order."
        data_tests:
          - not_null
          - relationships:
              name: order_id_foreign_key_in_stg_localbike__order_items
              arguments:
                to: ref('stg_localbike__orders')
                field: order_id
      - name: product_id
        description: "Foreign key linking the order item to the corresponding product."
        data_tests:
          - not_null
          - relationships:
              name: product_id_foreign_key_in_stg_localbike__order_items
              arguments:
                to: ref('stg_localbike__products')
                field: product_id
      - name: quantity
        description: "Number of units of the product in this order line."
        data_tests:
          - not_null
      - name: list_price
        description: "Catalog unit price of the product at the time of the order, before discount."
        data_tests:
          - not_null
      - name: discount
        description: "Discount applied to the line, as a fraction between 0 and 1. Checked by the singular test assert_discount_between_0_and_1."
        data_tests:
          - not_null

  - name: stg_localbike__orders
    description: "This model contains information about orders placed by customers, including status and dates."
    columns:
      - name: order_id
        description: "Primary key, unique identifier for each order."
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key linking the order to the customer who placed it."
        data_tests:
          - not_null
          - relationships:
              name: customer_id_foreign_key_in_stg_localbike__orders
              arguments:
                to: ref('stg_localbike__customers')
                field: customer_id
      - name: store_id
        description: "Foreign key linking the order to the store where it was placed."
        data_tests:
          - not_null
          - relationships:
              name: store_id_foreign_key_in_stg_localbike__orders
              arguments:
                to: ref('stg_localbike__stores')
                field: store_id
      - name: staff_id
        description: "Foreign key linking the order to the staff member who processed it."
        data_tests:
          - not_null
          - relationships:
              name: staff_id_foreign_key_in_stg_localbike__orders
              arguments:
                to: ref('stg_localbike__staffs')
                field: staff_id
      - name: order_status
        description: "Numeric status code of the order. Four values are observed (1, 2, 3, 4)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
      - name: order_date
        description: "Date on which the order was placed."
        data_tests:
          - not_null
      - name: required_date
        description: "Delivery date requested by the customer."
      - name: shipped_date
        description: "Shipping date of the order. Null when the order has no shipping date in the source."

  - name: stg_localbike__products
    description: "This model contains details of products available for sale, including model year, list price, brand, and category."
    columns:
      - name: product_id
        description: "Primary key, unique identifier for each product."
        data_tests:
          - unique
          - not_null
      - name: brand_id
        description: "Foreign key linking the product to its brand."
        data_tests:
          - not_null
          - relationships:
              name: brand_id_foreign_key_in_stg_localbike__products
              arguments:
                to: ref('stg_localbike__brands')
                field: brand_id
      - name: category_id
        description: "Foreign key linking the product to its category."
        data_tests:
          - not_null
          - relationships:
              name: category_id_foreign_key_in_stg_localbike__products
              arguments:
                to: ref('stg_localbike__categories')
                field: category_id
      - name: list_price
        description: "Current catalog price of the product."
        data_tests:
          - not_null

  - name: stg_localbike__staffs
    description: "This model contains information about the staff members working at the different stores."
    columns:
      - name: staff_id
        description: "Primary key, unique identifier for each staff member."
        data_tests:
          - unique
          - not_null
      - name: store_id
        description: "Foreign key linking the staff member to their assigned store."
        data_tests:
          - not_null
          - relationships:
              name: store_id_foreign_key_in_stg_localbike__staffs
              arguments:
                to: ref('stg_localbike__stores')
                field: store_id
      - name: manager_id
        description: "Identifier of the staff member who manages this person. Null for the top manager."
      - name: active
        description: "Indicates whether the staff member is currently active (1) or not (0)."
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: stg_localbike__stocks
    description: "This model contains information about product inventory levels across different stores."
    columns:
      - name: store_id
        description: "Foreign key part of the composite primary key, linking the stock level to a specific store."
        data_tests:
          - not_null
          - relationships:
              name: store_id_foreign_key_in_stg_localbike__stocks
              arguments:
                to: ref('stg_localbike__stores')
                field: store_id
      - name: product_id
        description: "Foreign key part of the composite primary key, linking the stock level to a specific product."
        data_tests:
          - not_null
          - relationships:
              name: product_id_foreign_key_in_stg_localbike__stocks
              arguments:
                to: ref('stg_localbike__products')
                field: product_id
      - name: quantity
        description: "Number of units of the product currently in stock in the store."
        data_tests:
          - not_null

  - name: stg_localbike__stores
    description: "This model contains information about the physical store locations of Local Bike."
    columns:
      - name: store_id
        description: "Primary key, unique identifier for each store."
        data_tests:
          - unique
          - not_null
      - name: store_name
        description: "Name of the store."
      - name: zip_code
        description: "Store zip code, stored as a string to keep leading zeros."